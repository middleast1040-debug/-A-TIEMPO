    // =========================================================================
    // 1. SINTETIZADOR WEB AUDIO API (TONOS MODERNOS SIN DESCARGAS DE AUDIO)
    // =========================================================================
    const playTransitTone = (type = 'gentle') => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') ctx.resume();

        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'gentle') {
          // Tono suave armónico (C5 -> E5)
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.15);
          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.2, now + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
          osc.start(now);
          osc.stop(now + 0.4);
        } else if (type === 'urgent') {
          // Tono de aviso / salida (E5 -> A5 con armónico)
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(659.25, now);
          osc.frequency.exponentialRampToValueAtTime(880.00, now + 0.22);
          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.26, now + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.48);
          osc.start(now);
          osc.stop(now + 0.5);
        } else if (type === 'transfer') {
          // Tono de validación de transbordo (Arpegio triple)
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440.00, now);
          osc.frequency.linearRampToValueAtTime(554.37, now + 0.1);
          osc.frequency.linearRampToValueAtTime(659.25, now + 0.2);
          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.22, now + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
          osc.start(now);
          osc.stop(now + 0.45);
        } else if (type === 'seismic') {
          // Tono de alerta sísmica pulsante
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.linearRampToValueAtTime(600, now + 0.2);
          osc.frequency.linearRampToValueAtTime(300, now + 0.4);
          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc.start(now);
          osc.stop(now + 0.65);
        }
      } catch (err) {
        console.warn('Audio contextual tone unavailable:', err);
      }
    };

    // Vibración Háptica Nativa
    const triggerHaptic = (pattern = [80]) => {
      try {

    // Monitoreo SGC (Servicio Geológico Colombiano)
    const LATEST_SGC_EARTHQUAKE = {
      eventDate: 'Hoy, 08:14 Hora Local',
      magnitude: 3.4,
      epicentro: 'Los Santos, Santander (Sentido leve en Boyacá y Cundinamarca)',
      profundidad: '142 km',

    // =========================================================================
    // 4. COMPONENTE PRINCIPAL
    // =========================================================================
    function ATiempoApp() {
      // Estado de navegación
      const [activeTab, setActiveTab] = useState('rutas'); // 'rutas' | 'ciudades' | 'transbordo' | 'tarjeta' | 'alertas'
      const [cityKey, setCityKey] = useState('bogota');
      const [themeMode, setThemeMode] = useState('dark');

      // Parámetros de Ruta y Cálculo
      const currentCity = COLOMBIA_CITIES[cityKey] || COLOMBIA_CITIES.bogota;
      const [selectedRouteId, setSelectedRouteId] = useState(currentCity.routes[0].id);
      const [originStop, setOriginStop] = useState(currentCity.stations[2] || 'Calle 100');
      const [destinationStop, setDestinationStop] = useState(currentCity.stations[currentCity.stations.length - 2] || 'Portal Usme');
      const [walkingMinutes, setWalkingMinutes] = useState(5);
      const [bufferMinutes, setBufferMinutes] = useState(2);
      const [isWakeUpAlarmActive, setIsWakeUpAlarmActive] = useState(false);
      const [travelMonitoring, setTravelMonitoring] = useState(false);

      // Buscador de rutas
      const [busSearchQuery, setBusSearchQuery] = useState('');
      const [busTypeFilter, setBusTypeFilter] = useState('all');

      // Estado de Ventana de Transbordo
      const [transferTimeSecs, setTransferTimeSecs] = useState(currentCity.transferWindowMins * 60);
      const [isTransferActive, setIsTransferActive] = useState(true);
      const [transferSavingsCop, setTransferSavingsCop] = useState(currentCity.fare * 2);

      // Estado de Tarjeta y Recargas
      const [cardBalanceCop, setCardBalanceCop] = useState(15400);
      const [selectedCardSkin, setSelectedCardSkin] = useState('roja'); // 'roja' | 'verde' | 'civica' | 'mio'
      const [transmiBiciValidations, setTransmiBiciValidations] = useState(22);
      const [rechargeMethod, setRechargeMethod] = useState('nequi'); // 'nequi' | 'daviplata' | 'pse' | 'breb'
      const [rechargeAmount, setRechargeAmount] = useState(20000);
      const [rechargeFeedback, setRechargeFeedback] = useState(null);

      // SGC y Alertas
      const [isTestingSeismic, setIsTestingSeismic] = useState(false);
      const [seismicTestFeedback, setSeismicTestFeedback] = useState(null);
      const [alertsFilter, setAlertsFilter] = useState('all');

      // Modales de Apoyo y Tutorial
      const [isSupportModalOpen, setIsSupportModalOpen] = useState(false);
      const [isTutorialOpen, setIsTutorialOpen] = useState(false);
      const [subsidizedProfile, setSubsidizedProfile] = useState(null);
      const [largeTextMode, setLargeTextMode] = useState(false);

      // Ruta seleccionada actual
      const activeRoute = useMemo(() => {
        return currentCity.routes.find(r => r.id === selectedRouteId) || currentCity.routes[0];
      }, [currentCity, selectedRouteId]);

      // Control del tema día/noche
      useEffect(() => {
        if (themeMode === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [themeMode]);

      // Contador de transbordo en tiempo real
      useEffect(() => {
        if (!isTransferActive) return;
        const interval = setInterval(() => {
          setTransferTimeSecs(prev => {
            if (prev <= 1) {
              setIsTransferActive(false);
              return 0;
            }
            if (prev === 900) {
              // 15 minutos restantes: emitir aviso suave
              playTransitTone('gentle');
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [isTransferActive]);

      // Cálculo de Salida a Pie Puerta a Puerta
      const busWaitTime = activeRoute.waitMins || 4;
      const rideTransitTime = 22;
      const secondsUntilDoorDeparture = Math.max(0, (busWaitTime - (walkingMinutes + bufferMinutes)) * 60 + 50);
      const depMins = Math.floor(secondsUntilDoorDeparture / 60);
      const depSecs = secondsUntilDoorDeparture % 60;

      // Filtro de rutas para el buscador
      const filteredBusRoutes = useMemo(() => {
        return currentCity.routes.filter(r => {
          const matchText = r.code.toLowerCase().includes(busSearchQuery.toLowerCase()) ||
                            r.name.toLowerCase().includes(busSearchQuery.toLowerCase()) ||
                            r.corridor.toLowerCase().includes(busSearchQuery.toLowerCase());
          const matchType = busTypeFilter === 'all' || r.type === busTypeFilter;
          return matchText && matchType;
        });
      }, [currentCity, busSearchQuery, busTypeFilter]);

      // Acción de recarga
      const handleExecuteRecharge = () => {
        setCardBalanceCop(prev => prev + rechargeAmount);
        playTransitTone('transfer');
        triggerHaptic([100, 50, 100]);
        setRechargeFeedback(`¡Recarga exitosa de $${rechargeAmount.toLocaleString('es-CO')} por ${rechargeMethod.toUpperCase()}! Saldo activado para validar en tótem.`);

      // Prueba de alarma sísmica SGC
      const handleTestSeismic = () => {
        setIsTestingSeismic(true);
        playTransitTone('seismic');
        triggerHaptic([150, 80, 150, 80, 300]);
        setSeismicTestFeedback('Simulacro Sísmico: Sonido y vibración activos. Mantén la calma y sigue las instrucciones del personal.');
        setTimeout(() => {
          setIsTestingSeismic(false);
          setSeismicTestFeedback(null);
        }, 3500);
      };

      // Formatear segundos en MM:SS
      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m}m ${s < 10 ? '0' : ''}${s}s`;
      };

      return (
        <div className={`w-full flex-1 flex flex-col items-center ${largeTextMode ? 'text-base' : 'text-sm'}`}>
          {/* =============================================================== */}
          {/* CABECERA (HEADER) */}
          {/* =============================================================== */}
          <header className="w-full border-b border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-[#070D18]/95 backdrop-blur-md sticky top-0 z-30 transition-colors">
            <div className="max-w-4xl mx-auto px-4 sm:px-6 h-14 sm:h-16 flex items-center justify-between gap-3">

                          subsidizedProfile === sub.id
                            ? 'bg-[#EFF6FF] dark:bg-blue-950 text-[#0060EA] dark:text-[#38BDF8] border-[#0070F3] ring-1 ring-[#0070F3]'
                            : 'bg-slate-50 dark:bg-slate-950 border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300'
                        }`}
                      >
                        <div className="font-bold">{sub.label}</div>
                        <div className="text-[10px] text-slate-500 mt-0.5">{sub.desc}</div>
                      </button>
                    ))}
                  </div>

                  {subsidizedProfile && (
                    <div className="p-2.5 rounded-xl bg-blue-50 dark:bg-blue-950/60 border border-blue-200 dark:border-blue-900 text-[#0060EA] dark:text-[#38BDF8] font-bold text-center">
                      ✓ Perfil con subsidio asignado en tu aplicación
                    </div>
                  )}
                </div>

                <button
                  type="button"
                  onClick={() => setIsSupportModalOpen(false)}
                  className="w-full py-2.5 rounded-xl bg-gradient-to-r from-[#0080FF] to-[#0060EA] text-white font-bold text-xs shadow-md shadow-blue-500/25 cursor-pointer"
                >
                  Guardar Preferencias
                </button>
              </div>
            </div>
          )}

          {/* =============================================================== */}
          {/* MODAL DE TUTORIAL GUIADO */}
          {/* =============================================================== */}
          {isTutorialOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-in fade-in">
              <div className="relative w-full max-w-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 sm:p-6 text-left space-y-4 max-h-[90vh] overflow-y-auto custom-scroll">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-bold uppercase tracking-wider text-white bg-gradient-to-r from-[#0080FF] to-[#0060EA] px-2.5 py-0.5 rounded-lg">
                      Guía Rápida
                    </span>
                    <h3 className="text-sm font-black text-slate-900 dark:text-white">Cómo Usar A Tiempo</h3>
                  </div>
                  <button
                    type="button"
                    onClick={() => setIsTutorialOpen(false)}
                    className="p-1 rounded-lg text-slate-400 hover:text-slate-800 dark:hover:text-white"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-3 text-xs text-slate-600 dark:text-slate-300">
                  <div className="p-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800">
                    <strong className="text-slate-900 dark:text-white block mb-0.5">1. Salida Exacta & Ubicador de Bus:</strong>
                    Consulta en qué vagón o puerta para tu bus y mira cuántos minutos tienes para salir de casa antes de que llegue.
                  </div>
                  <div className="p-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800">
                    <strong className="text-slate-900 dark:text-white block mb-0.5">2. Alarma «Avísame al llegar»:</strong>
                    Activa la alarma para recibir un tono suave 2 estaciones antes de tu parada final y viajar sin temor a pasarte.
                  </div>
                  <div className="p-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800">
                    <strong className="text-slate-900 dark:text-white block mb-0.5">3. Ventana de Transbordo ($0 COP):</strong>
                    Controla tus 125 minutos de transbordo gratuito y mira tu ahorro acumulado en cada viaje.
                  </div>
                  <div className="p-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800">
                    <strong className="text-slate-900 dark:text-white block mb-0.5">4. Tarjeta, TransMiBici & Recargas:</strong>
                    Recarga con Nequi, Daviplata o PSE y gana pasajes gratis registrando tu bicicleta en los cicloparqueaderos oficiales.
                  </div>
                  <div className="p-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800">
                    <strong className="text-slate-900 dark:text-white block mb-0.5">5. Alertas & Sismos del SGC:</strong>
                    Infórmate del estado de las vías y sigue el protocolo oficial sísmico con líneas directas de emergencia.
                  </div>
                </div>

                <button
                  type="button"
                  onClick={() => setIsTutorialOpen(false)}
                  className="w-full py-2.5 rounded-xl bg-gradient-to-r from-[#0080FF] to-[#0060EA] text-white font-bold text-xs shadow-md shadow-blue-500/25 cursor-pointer"
                >
                  Entendido, ¡Comenzar!
                </button>
              </div>
            </div>
          )}

          {/* =============================================================== */}
          {/* PIE DE PÁGINA */}
          {/* =============================================================== */}
          <footer className="w-full border-t border-slate-200 dark:border-slate-800 py-4 text-center text-xs text-slate-500 dark:text-slate-400 bg-white/50 dark:bg-[#070D18]/50">
            <p>A Tiempo · Tu salida exacta en transporte masivo en Colombia</p>
          </footer>
        </div>
      );
    }

    // Renderizar aplicación
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ATiempoApp />);
  </script>
</body>
</html>
